<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo terminal -->
  <rect x="5" y="5" width="590" height="110" rx="8" fill="url(#bg)" stroke="#333" stroke-width="2"/>
  
  <!-- Barra de título -->
  <rect x="5" y="5" width="590" height="28" rx="8" fill="#2d2d2d"/>
  <rect x="5" y="20" width="590" height="13" fill="#2d2d2d"/>
  
  <!-- Botones Mac -->
  <circle cx="25" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="45" cy="19" r="6" fill="#febc2e"/>
  <circle cx="65" cy="19" r="6" fill="#28c840"/>
  
  <!-- Título terminal -->
  <text x="300" y="23" text-anchor="middle" font-family="monospace" font-size="11" fill="#888">zsh — 80×24</text>
  
  <!-- Cursor parpadeante (estático) -->
  <rect x="12" y="48" width="8" height="16" fill="#4af626">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Texto principal -->
  <text x="28" y="62" font-family="monospace" font-size="14" fill="#4af626" font-weight="bold">
    $ hot-clipboard --version
  </text>
  <text x="28" y="82" font-family="monospace" font-size="14" fill="#f0a500">
    hot-clipboard v1.0.0
  </text>
  <text x="28" y="100" font-family="monospace" font-size="12" fill="#888">
    hc | hp — clipboard reimagined for macOS
  </text>
  
  <!-- Borde final -->
  <rect x="5" y="110" width="590" height="5" fill="#1a1a1a" rx="0"/>
</svg>
